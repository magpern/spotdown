<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>spotdown</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
<div class="wrap">
  <h1>spotdown</h1>
  <p class="sub">Paste a Spotify link to fetch metadata and request a download from the server.</p>

  <div class="card">
    <label for="url">Spotify URL</label>
    <input id="url" type="text" placeholder="https://open.spotify.com/track/..." autocomplete="off" />
    <div class="row mt">
      <button id="lookup">Look up</button>
      <button id="convert" class="ghost">Convert &amp; download</button>
      <button id="analyze" class="ghost">Analyze</button>
    </div>

    <div class="row mt">
      <div>
        <label for="format">Format</label>
        <select id="format"><option value="mp3">mp3</option><option value="m4a">m4a</option></select>
      </div>
      <div>
        <label for="bitrate">Bitrate</label>
        <select id="bitrate"><option>320</option><option>256</option><option>192</option><option>128</option></select>
      </div>
    </div>

  </div>

  <div id="fileCard" class="card" style="display:none">
    <label for="file">Local audio file (mp3, m4a or wav)</label>
    <div id="drop" class="drop">Drop a file here, or <input id="file" type="file" accept=".mp3,.m4a,.mp4,.wav,audio/*" /></div>
  </div>

  <div id="trackCard" class="card" style="display:none"></div>
  <div id="statusCard" class="card" style="display:none"><div id="status" class="status"></div></div>
  <div id="analysisCard" class="card" style="display:none"></div>
</div>

<script src="ui_common.js"></script>
<script src="analysis_model.js"></script>
<script src="analysis_timeline.js"></script>
<script src="waveform_model.js"></script>
<script src="waveform_view.js"></script>
<script src="waveform_player.js"></script>
<script src="analysis_view.js"></script>
<script src="ui.js"></script>
<script src="upload.js"></script>
</body>
</html>
