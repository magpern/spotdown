<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>spotdown</title>
<style>
  :root {
    --bg: #0e1013; --card: #181b20; --line: #2a2f37; --fg: #e8eaed;
    --muted: #9aa3af; --accent: #1db954; --accent-fg: #06130b; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  input[type=text], select {
    width: 100%; padding: 10px 12px; background: #11141a; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; font-size: 14px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; }
  button {
    background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px;
    padding: 10px 16px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .mt { margin-top: 12px; }
  .track { display: flex; gap: 12px; align-items: center; }
  .track img { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; background: #11141a; }
  .track .t { font-weight: 600; }
  .track .a { color: var(--muted); font-size: 13px; }
  .status { font-size: 13px; color: var(--muted); }
  .status.err { color: var(--err); white-space: pre-wrap; }
  a.dl { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; text-decoration: none; }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .meta { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .mrow { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13px; }
  .mk { color: var(--muted); } .mv { text-align: right; word-break: break-word; }
  .dim { color: #5b636e; }
  code { background:#11141a; border:1px solid var(--line); border-radius:4px; padding:1px 4px; font-size:12px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { flex:1; min-width:70px; background:#11141a; border:1px solid var(--line); border-radius:8px; padding:8px 10px; text-align:center; }
  .stat .sv { font-size:20px; font-weight:700; }
  .stat .sl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .badge { font-size:11px; padding:2px 7px; border-radius:20px; font-weight:600; }
  .badge.ok { background:rgba(29,185,84,.18); color:var(--accent); }
  .badge.warn { background:rgba(255,176,32,.18); color:#ffb020; }
  .viz-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:12px 0 5px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:6px; }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .seg { display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; }
  .seg .dot { width:10px; height:10px; border-radius:2px; flex:none; }
  .seg .st { color:var(--muted); font-variant-numeric:tabular-nums; width:96px; flex:none; }
  .seg .slab { flex:1; }
  .seg .se { color:var(--muted); }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:s .7s linear infinite; vertical-align:-1px; margin-right:6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>spotdown</h1>
  <p class="sub">Paste a Spotify link to fetch metadata and request a download from the server.</p>

  <div class="card">
    <label for="url">Spotify URL</label>
    <input id="url" type="text" placeholder="https://open.spotify.com/track/..." autocomplete="off" />
    <div class="row mt">
      <button id="lookup">Look up</button>
      <button id="convert" class="ghost">Convert &amp; download</button>
      <button id="analyze" class="ghost">Analyze</button>
    </div>

    <div class="row mt">
      <div>
        <label for="format">Format</label>
        <select id="format"><option value="mp3">mp3</option><option value="m4a">m4a</option></select>
      </div>
      <div>
        <label for="bitrate">Bitrate</label>
        <select id="bitrate"><option>320</option><option selected>256</option><option>192</option><option>128</option></select>
      </div>
    </div>

  </div>

  <div id="trackCard" class="card" style="display:none"></div>
  <div id="statusCard" class="card" style="display:none"><div id="status" class="status"></div></div>
  <div id="analysisCard" class="card" style="display:none"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
// When opened as a served page, use relative URLs. When opened as a local file
// (e.g. an editor preview), fall back to the dev server so fetch() still works.
const API_BASE = (location.protocol === "http:" || location.protocol === "https:")
  ? "" : "http://localhost:8000";
const trackCard = $("trackCard"), statusCard = $("statusCard"), statusEl = $("status");
const analysisCard = $("analysisCard");
let currentTrackId = null;

const SEG_COLORS = {
  "intro": "#6b7280", "verse": "#3b82f6", "chorus/drop": "#1db954",
  "breakdown/quiet": "#a78bfa", "outro": "#6b7280",
};
const segColor = (label) => SEG_COLORS[label] || "#3b82f6";

function showStatus(html, isErr) {
  statusCard.style.display = "block";
  statusEl.className = "status" + (isErr ? " err" : "");
  statusEl.innerHTML = html;
}
function fmtDur(s) {
  if (s === null || s === undefined) return null;
  const m = Math.floor(s / 60), ss = String(s % 60).padStart(2, "0");
  return `${m}:${ss}`;
}
function renderTrack(t) {
  currentTrackId = t.id || null;
  trackCard.style.display = "block";
  const cover = t.cover_url ? `<img src="${t.cover_url}" alt="">` : `<img alt="">`;
  const artist = (t.artists && t.artists.length) ? t.artists.join(", ") : "";
  const rows = [
    ["Title", t.title],
    ["Artists", artist],
    ["Album", t.album],
    ["Duration", fmtDur(t.duration_s)],
    ["ISRC", t.isrc],
    ["Track ID", t.id],
  ];
  const meta = rows.map(([k, v]) =>
    `<div class="mrow"><span class="mk">${k}</span>` +
    `<span class="mv">${v ? escapeHtml(String(v)) : '<span class="dim">—</span>'}</span></div>`
  ).join("");
  const link = t.spotify_url
    ? `<a class="dl" href="${t.spotify_url}" target="_blank" rel="noopener">Open on Spotify ↗</a>` : "";
  const sparse = !artist || !t.album || t.duration_s == null;
  const hint = sparse
    ? `<div class="hint">Only title + cover come from Spotify's public oEmbed endpoint. ` +
      `Set <code>SPOTIFY_CLIENT_ID</code> / <code>SPOTIFY_CLIENT_SECRET</code> on the server ` +
      `for artists, album, duration and ISRC.</div>` : "";
  trackCard.innerHTML = `<div class="track">${cover}
    <div><div class="t">${escapeHtml(t.title || "")}</div>
    <div class="a">${escapeHtml(artist || t.album || "")}</div></div></div>
    <div class="meta">${meta}</div>${link}${hint}`;
}
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function lookup() {
  const url = $("url").value.trim();
  if (!url) return;
  showStatus('<span class="spin"></span>Looking up…');
  try {
    const r = await fetch(`${API_BASE}/api/Gettrack?spotify_url=${encodeURIComponent(url)}`);
    const d = await r.json();
    if (!r.ok) return showStatus("Lookup failed: " + (d.detail || r.status), true);
    if (!d.tracks || !d.tracks.length) return showStatus("No tracks found.", true);
    renderTrack(d.tracks[0]);
    showStatus(d.count > 1 ? `Resolved ${d.count} tracks (showing first).` : "Metadata loaded.");
  } catch (e) { showStatus("Network error: " + e.message, true); }
}

async function convert() {
  const url = $("url").value.trim();
  if (!url) return showStatus("Enter a Spotify URL first.", true);
  const body = { spotify_url: url, format: $("format").value, bitrate: parseInt($("bitrate").value, 10) };

  $("convert").disabled = true;
  showStatus('<span class="spin"></span>Requesting conversion…');
  try {
    const r = await fetch(`${API_BASE}/api/v1/convert`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    if (d.track) renderTrack(d.track);
    if (d.status === "done") return done(d.download_url);
    await poll(d.task_id);
  } catch (e) {
    showStatus("Convert failed: " + e.message, true);
  } finally { $("convert").disabled = false; }
}

async function poll(taskId) {
  for (let i = 0; i < 120; i++) {
    const r = await fetch(`${API_BASE}/api/v1/tasks/${encodeURIComponent(taskId)}`);
    const d = await r.json();
    if (d.status === "done") return done(d.download_url);
    if (d.status === "failed") return showStatus("Conversion failed:\n" + (d.error || "unknown error"), true);
    showStatus(`<span class="spin"></span>${d.status === "processing" ? "Converting on the server…" : "Queued…"}`);
    await new Promise(res => setTimeout(res, 1500));
  }
  showStatus("Timed out waiting for the server.", true);
}

function done(downloadUrl) {
  showStatus(`Done. <a class="dl" href="${downloadUrl}" download>⬇ Download file</a>`);
}

async function analyze() {
  if (!currentTrackId) return showStatus("Look up a track first.", true);
  $("analyze").disabled = true;
  showStatus('<span class="spin"></span>Analyzing audio… (first run can take ~10s)');
  try {
    const r = await fetch(`${API_BASE}/api/v1/analyze/${encodeURIComponent(currentTrackId)}`);
    const d = await r.json();
    if (r.status === 404) return showStatus("Convert the track first — analysis needs the downloaded file.", true);
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
    renderAnalysis(d);
    showStatus("Analysis ready.");
  } catch (e) {
    showStatus("Analysis failed: " + e.message, true);
  } finally { $("analyze").disabled = false; }
}

function segmentBar(d) {
  const W = 1000, H = 30, dur = d.analyzed_duration_s || 1;
  const rects = d.segments.map(s => {
    const x = (s.start / dur) * W, w = Math.max(((s.end - s.start) / dur) * W, 1);
    return `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${H}" fill="${segColor(s.label)}" opacity="0.85"></rect>`;
  }).join("");
  const drops = (d.drops || []).map(t => {
    const x = (t / dur) * W;
    return `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}" stroke="#fff" stroke-width="2"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="border-radius:6px;display:block">${rects}${drops}</svg>`;
}

function energyCurve(d) {
  const W = 1000, H = 54, dur = d.analyzed_duration_s || 1;
  const pts = d.energy_curve || [];
  if (!pts.length) return "";
  const xy = (p, key) => [((p.t / dur) * W), (H - (p[key] || 0) * H)];
  const line = (key, color, fill) => {
    const path = pts.map((p, i) => { const [x, y] = xy(p, key); return `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`; }).join(" ");
    const area = `M0,${H} ` + pts.map(p => { const [x, y] = xy(p, key); return `L${x.toFixed(1)},${y.toFixed(1)}`; }).join(" ") + ` L${W},${H} Z`;
    return (fill ? `<path d="${area}" fill="${color}" opacity="0.18"/>` : "") + `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  };
  const dropLines = (d.drops || []).map(t => { const x = (t / dur) * W; return `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}" stroke="#1db954" stroke-width="1.5" stroke-dasharray="3,2"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">${line("percussive", "#f59e0b", true)}${line("full", "#60a5fa", false)}${dropLines}</svg>`;
}

function renderAnalysis(d) {
  analysisCard.style.display = "block";
  const align = d.spotify_duration_s == null ? ""
    : (d.timeline_matches_spotify
        ? `<span class="badge ok">timeline aligned</span>`
        : `<span class="badge warn">off Spotify by ${d.duration_delta_s}s</span>`);
  const stats = `<div class="stats">
    <div class="stat"><div class="sv">${d.bpm}</div><div class="sl">BPM</div></div>
    <div class="stat"><div class="sv">${fmtDur(Math.round(d.analyzed_duration_s))}</div><div class="sl">Length</div></div>
    <div class="stat"><div class="sv">${(d.drops||[]).length}</div><div class="sl">Drops</div></div>
    <div class="stat"><div class="sv">${(d.segments||[]).length}</div><div class="sl">Segments</div></div>
  </div>`;
  const legendLabels = [...new Set((d.segments||[]).map(s => s.label))];
  const legend = `<div class="legend">` +
    legendLabels.map(l => `<span><i style="background:${segColor(l)}"></i>${l}</span>`).join("") +
    `<span><i style="background:#fff"></i>drop</span></div>`;
  const segs = (d.segments||[]).map(s =>
    `<div class="seg"><span class="dot" style="background:${segColor(s.label)}"></span>` +
    `<span class="st">${fmtDur(Math.round(s.start))}–${fmtDur(Math.round(s.end))}</span>` +
    `<span class="slab">${s.label}<span class="dim"> · grp ${s.group}</span></span>` +
    `<span class="se">${Math.round(s.energy_struct*100)}%</span></div>`).join("");
  analysisCard.innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
       <div style="font-weight:600">Audio analysis</div>${align}</div>
     <div class="hint">BPM candidates: ${d.bpm_candidates.join(", ")} · meter ${d.meter_assumed} · leading silence ${d.leading_silence_s}s · labels are heuristic</div>
     ${stats}
     <div class="viz-label">Structure &amp; drops</div>${segmentBar(d)}${legend}
     <div class="viz-label">Energy — percussive (orange) vs full (blue), drops dashed</div>${energyCurve(d)}
     <div class="viz-label">Segments</div>${segs}`;
}

$("lookup").addEventListener("click", lookup);
$("convert").addEventListener("click", convert);
$("analyze").addEventListener("click", analyze);
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });
</script>
</body>
</html>
