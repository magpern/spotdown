services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports: only the containers use Redis (ADR 0003).

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    # Loopback only unless SPOTDOWN_PUBLISH_HOST widens it (ADR 0003); the app never reads it.
    ports:
      - "${SPOTDOWN_PUBLISH_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: rq worker -u redis://redis:6379/0 spotdown
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
